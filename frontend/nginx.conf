# Mirrors the /auth and /patients proxy rules from vite.config.ts's dev
# server, but pointed at the `api` service on the docker network instead of
# localhost:3000.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /auth {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /patients {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback - client-side routing (react-router's BrowserRouter)
    # owns every other path.
    location / {
        try_files $uri /index.html;
    }
}
