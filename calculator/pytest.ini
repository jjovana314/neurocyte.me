[pytest]
# Coverage gate for the calculator service.
# Scoped to the `calculator` package; app.py (gRPC wiring) and generated/ are
# omitted in .coveragerc since they have no unit tests.
# Ratchet: keep --cov-fail-under at the current level; raise it as coverage improves.
addopts =
    --cov=calculator
    --cov-config=calculator/.coveragerc
    --cov-report=term-missing
    --cov-fail-under=100
