# Dockerized backend (API + its MySQL database) for now - the calculator
# gRPC service and the frontend aren't containerized yet, so the API here
# talks to the calculator running on the host (see `npm run start:calculator`
# from the repo root) via host.docker.internal.
#
# Usage: copy api/env.example to api/.env (if you haven't already, see
# README.md) and run `docker compose up --build`.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      # Dev-only default credentials. If you change these, update the api
      # service's DATABASE_USERNAME/DATABASE_PASSWORD/DATABASE_NAME below to
      # match.
      MYSQL_ROOT_PASSWORD: neurocyte_dev
      MYSQL_DATABASE: neurocyte
    ports:
      - '3306:3306'
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Picks up SECRET_KEY, MAIL_*, ACCESS_TOKEN_TIME, REFRESH_TOKEN_TIME,
    # FRONTEND_URL, APP_URL, etc. from your existing local dev config.
    env_file:
      - ./api/.env
    environment:
      # These must point at the docker network rather than whatever
      # api/.env has configured for host-based (non-docker) dev.
      DATABASE_URL: db
      DATABASE_PORT: '3306'
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: neurocyte_dev
      DATABASE_NAME: neurocyte
      CALCULATOR_GRPC_URL: host.docker.internal:50051
    ports:
      - '3000:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  db-data:
