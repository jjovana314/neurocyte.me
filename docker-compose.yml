# Dockerized app: frontend, API, its MySQL database, the calculator
# gRPC service, and LocalStack (local AWS for the mail-service sidecar).
#
# Usage: copy .env.example to .env in the repo root (if you haven't already,
# see README.md) and run `docker compose up --build`.
services:
  db:
    image: mysql:8.4
    restart: always
    environment:
      # Dev-only default credentials. If you change these, update the api
      # service's DATABASE_USERNAME/DATABASE_PASSWORD/DATABASE_NAME below to
      # match.
      MYSQL_ROOT_PASSWORD: neurocyte_dev
      MYSQL_DATABASE: neurocyte
    ports:
      # Host port 3307, not 3306, so it doesn't collide with a host-installed
      # MySQL (e.g. Homebrew) on 127.0.0.1:3306 - otherwise host-side clients
      # can silently connect to that server instead of this one.
      - '3307:3306'
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20

  calculator:
    build:
      context: ./calculator
    restart: unless-stopped
    environment:
      CALCULATOR_GRPC_PORT: '50051'
    ports:
      - '50051:50051'

  # Local AWS (SQS, Lambda, SES, ...) for the mail-service sidecar.
  # Deploy the stack into it with `npm run local:deploy --prefix api/mail-service`
  # (see api/mail-service/README.md). Sent emails: http://localhost:4566/_aws/ses
  localstack:
    image: localstack/localstack:4
    restart: unless-stopped
    environment:
      # Only needed if your LocalStack image/plan requires an auth token.
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    ports:
      - '4566:4566'
    volumes:
      # LocalStack runs each Lambda in its own container.
      - /var/run/docker.sock:/var/run/docker.sock

  api:
    build:
      context: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      calculator:
        condition: service_started
      localstack:
        condition: service_started
    # Picks up SECRET_KEY, ACCESS_TOKEN_TIME, REFRESH_TOKEN_TIME,
    # FRONTEND_URL, APP_URL, etc. from your existing local dev config.
    env_file:
      - ./.env
    environment:
      # These must point at the docker network rather than whatever
      # .env has configured for host-based (non-docker) dev.
      DATABASE_URL: db
      DATABASE_PORT: '3306'
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: neurocyte_dev
      DATABASE_NAME: neurocyte
      CALCULATOR_GRPC_URL: calculator:50051
      # Mail goes to the LocalStack SQS queue; LocalStack accepts any keys.
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      MAIL_QUEUE_URL: http://localstack:4566/000000000000/neurocyte-mail
    ports:
      - '3000:3000'

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Host port matches .env's FRONTEND_URL (http://localhost:5173),
      # used in password-reset/deactivation email links.
      - '5173:80'

volumes:
  db-data:
